name: Build TurboMacro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TurboMacro-v1.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMacro-Debug-APK
          path: TurboMacro-v1.4.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: "TurboMacro v1.4.0（三角洲：按住悬浮钮开火 + 同时拖屏）"
          body: "覆盖安装 `TurboMacro-v1.4.apk`。\n\n- 开火仍用悬浮按钮长按，不用音量键开火\n- 悬浮窗增加 FLAG_SPLIT_TOUCH：按住按钮时另一根手指可拖屏瞄准\n- Shizuku 短点注入（无 MOVE），减少对瞄准手势干扰\n- 音量+ 仅用于呼出编辑"
          files: TurboMacro-v1.4.apk
