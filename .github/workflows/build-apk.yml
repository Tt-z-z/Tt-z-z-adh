name: Build TurboMacro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + NDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TurboMacro-v1.6.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMacro-Debug-APK
          path: TurboMacro-v1.6.1.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: "TurboMacro v1.6.1（TouchMux 打包修复 · 拖枪不中断）"
          body: |
            覆盖安装 `TurboMacro-v1.6.apk`。

            ## 为什么 v1.5 仍会断拖枪
            Android 每个窗口同时只跟进「一个」触控设备。`input tap` / 合成 MotionEvent 等于第二台设备抢焦点，正在滑动的手指会被系统丢掉。

            ## v1.6 做法（TouchMux）
            1. 经 Shizuku 启动 `libtouchmux.so`
            2. **EVIOCGRAB 抢占物理触控屏**，把玩家手指转发到虚拟触控设备
            3. 开火点按加在**同一虚拟设备的额外 MT 槽**，与走位/瞄准同流
            4. 彻底禁用按住期间的 `input tap` / 无障碍手势
            5. 常驻进程 + PING 保活，去掉每发 fork 的卡顿竞态

            ## 使用注意
            - 需要 Shizuku +「USB 调试（安全设置）」
            - 开启悬浮键时请**松开屏幕全部手指约 1 秒**（抢占需要空闲）
            - 关闭悬浮键会自动归还触控屏；若异常可音量键或关悬浮恢复
          files: TurboMacro-v1.6.1.apk
