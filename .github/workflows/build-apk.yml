name: Build TurboMacro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TurboMacro-v1.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMacro-Debug-APK
          path: TurboMacro-v1.3.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "TurboMacro 极速肩键宏 v1.3.0 (多指不抢指 & 按钮大小可调)"
          body: "手机端点击下方 Assets 中的 `TurboMacro-v1.3.apk` 即可直接下载安装。\n\n更新内容：\n1. 修复按住宏时屏幕其他操作失灵：Shizuku 使用独立虚拟触控设备，不再抢走走位/瞄准手指。\n2. 按住并发时禁止降级到无障碍手势，避免 dispatchGesture 打断游戏触控。\n3. 触发键大小可调（36~96dp），App 内滑条 + 编辑态「键缩小/键放大」。\n4. 悬浮窗增加 FLAG_NOT_TOUCH_MODAL，窗口外触控 100% 穿透。"
          files: TurboMacro-v1.3.apk
