name: Build TurboMacro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run host TouchMux regression tests
        run: |
          set -euo pipefail
          cc -std=gnu11 -Wall -Wextra -g -O1 \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/touchmux_test.c -o /tmp/touchmux-tests
          timeout 30s /tmp/touchmux-tests

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android cmdline-tools + NDK + CMake
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          # GITHUB_PATH only applies to later steps — call sdkmanager by absolute path here
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties
          ls -la "$ANDROID_HOME/ndk/26.1.10909125" | head

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          set -euo pipefail
          test -f local.properties
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TurboMacro-v1.6.6-diagnostic.apk
          unzip -l TurboMacro-v1.6.6-diagnostic.apk | grep -E 'lib/.*/libtouchmux' || (
            echo "ERROR: libtouchmux.so missing from APK" >&2
            unzip -l TurboMacro-v1.6.6-diagnostic.apk | grep '\.so' || true
            exit 1
          )

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMacro-Debug-APK
          path: TurboMacro-v1.6.6-diagnostic.apk
          if-no-files-found: error

      # 调试阶段只保存构建产物，不自动发布或覆盖 Release。
      # 编译成功不代表设备兼容性及触摸恢复路径已经验证。
