name: Build TurboMacro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android cmdline-tools + NDK + CMake
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          # GITHUB_PATH only applies to later steps — call sdkmanager by absolute path here
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties
          ls -la "$ANDROID_HOME/ndk/26.1.10909125" | head

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          set -euo pipefail
          test -f local.properties
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TurboMacro-v1.6.1.apk
          unzip -l TurboMacro-v1.6.1.apk | grep -E 'lib/.*/libtouchmux' || (
            echo "ERROR: libtouchmux.so missing from APK" >&2
            unzip -l TurboMacro-v1.6.1.apk | grep '\.so' || true
            exit 1
          )

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMacro-Debug-APK
          path: TurboMacro-v1.6.1.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: "TurboMacro v1.6.1（TouchMux 多指合并 · 拖枪不中断）"
          body: |
            覆盖安装 `TurboMacro-v1.6.1.apk`。

            ## 根因
            Android 每个窗口同时只跟进一个触控设备。`input tap` / 合成 MotionEvent = 第二台设备抢焦点，正在滑动的手指会被丢掉。

            ## TouchMux
            1. Shizuku 启动 `libtouchmux.so`
            2. EVIOCGRAB 抢占物理触控屏，转发到虚拟设备
            3. 开火点按加在**同一设备额外 MT 槽**
            4. 按住期间禁用 input tap / 无障碍
            5. 常驻进程 + 非阻塞心跳，去掉每发 fork 的卡顿

            ## 使用
            - Shizuku +「USB 调试（安全设置）」
            - 开悬浮键时**松开全部手指约 1 秒**
            - 关悬浮键会归还触控屏
          files: TurboMacro-v1.6.1.apk
