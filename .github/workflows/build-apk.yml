name: Build TurboMacro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TurboMacro-v1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMacro-Debug-APK
          path: TurboMacro-v1.1.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "TurboMacro 极速肩键宏 v1.1.0 (音量+呼出编辑 & 游戏触控修复版)"
          body: "手机端点击下方 Assets 中的 `TurboMacro-v1.1.apk` 即可直接下载安装（无需解压）。\n\n更新内容：\n1. 战斗态彻底隐藏顶部胶囊栏，按【音量+】一键进入/退出编辑模式。\n2. 彻底修复游戏内点击不生效问题（解决无障碍跨窗口手势拦截与 60/120fps 游戏引擎采样漏帧）。"
          files: TurboMacro-v1.1.apk
