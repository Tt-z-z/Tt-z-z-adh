name: Build TurboMacro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TurboMacro-v1.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboMacro-Debug-APK
          path: TurboMacro-v1.5.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "TurboMacro v1.5.0（严格多指共存审核版）"
          body: "覆盖安装 `TurboMacro-v1.5.apk`。\n\n审核修复：\n1. 去掉战斗态全屏水波纹窗（HyperOS 上会干扰多指）\n2. 编辑条战斗态从 WindowManager 彻底移除（不只是 GONE）\n3. 开火注入改为 Shizuku `input tap`，不向物理触控屏塞 ACTION_DOWN（避免清掉走位/瞄准手指）\n4. 按住连发强制要求 Shizuku，禁止无障碍降级\n5. 保留 FLAG_SPLIT_TOUCH + 仅按钮区域可点"
          files: TurboMacro-v1.5.apk
